<!DOCTYPE html>

<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="extensionName"></title>
  <link rel="stylesheet" href="signatur.css">
</head>
<body>
  <header class="top">
    <h1><span data-i18n="extensionName"></span> <small id="version"></small></h1>
    <p data-i18n="intro"></p>
  </header>

  <main class="layout">
    <form id="form" class="fields" autocomplete="off">
      <section>
        <h2 data-i18n="secPerson"></h2>
        <div class="grid">
          <label><span data-i18n="fName"></span><input data-p="name"></label>
          <label><span data-i18n="fTitle"></span><input data-p="title"></label>
          <label><span data-i18n="fDepartment"></span><input data-p="department"></label>
          <label><span data-i18n="fPhone"></span><input data-p="phone" data-i18n-placeholder="phPhoneCompany"></label>
          <label><span data-i18n="fMobile"></span><input data-p="mobile"></label>
        </div>
        <button type="button" id="fromContacts" class="link" data-i18n="fromContacts"></button>
      </section>

      <section>
        <h2 data-i18n="secAccounts"></h2>
        <ul id="identities" class="checks"></ul>
      </section>

      <section id="companySection">
        <h2 data-i18n="secCompany"></h2>
        <p id="lockNote" class="note lock" hidden></p>
        <div class="grid">
          <label class="wide"><span data-i18n="fCompany"></span><input data-c="name" data-i18n-placeholder="phCompany"></label>
          <label class="wide"><span data-i18n="fStreet"></span><input data-c="street"></label>
          <label><span data-i18n="fZip"></span><input data-c="zip"></label>
          <label><span data-i18n="fCity"></span><input data-c="city"></label>
          <label><span data-i18n="fCountry"></span><input data-c="country"></label>
          <label><span data-i18n="fCompanyPhone"></span><input data-c="phone"></label>
          <label class="wide"><span data-i18n="fWebsite"></span><input data-c="website" placeholder="www.beispiel.de"></label>
          <label><span data-i18n="fGreeting"></span><input data-c="greeting"></label>
          <label><span data-i18n="fGreetingPos"></span>
            <select data-c="greetingPosition">
              <option value="above" data-i18n="gpAbove"></option>
              <option value="text" data-i18n="gpText"></option>
            </select></label>
        </div>

        <h3 data-i18n="secDesign"></h3>
        <div class="designs" id="designs">
          <label><input type="radio" name="design" value="classic"> <span data-i18n="dClassic"></span></label>
          <label><input type="radio" name="design" value="modern"> <span data-i18n="dModern"></span></label>
          <label><input type="radio" name="design" value="compact"> <span data-i18n="dCompact"></span></label>
        </div>
        <div class="grid">
          <label><span data-i18n="fFont"></span>
            <select data-c="font">
              <option value="Arial, Helvetica, sans-serif">Arial</option>
              <option value="Calibri, Arial, sans-serif">Calibri</option>
              <option value="'Segoe UI', Arial, sans-serif">Segoe UI</option>
              <option value="Verdana, Geneva, sans-serif">Verdana</option>
              <option value="Georgia, 'Times New Roman', serif">Georgia</option>
            </select>
          </label>
          <label><span data-i18n="fFontSize"></span>
            <select data-c="fontSize"><option>9</option><option>10</option><option>11</option><option>12</option></select>
          </label>
          <div class="wide">
            <span class="lbl" data-i18n="fAccent"></span>
            <div id="palette" class="palette"></div>
          </div>
          <div class="wide logo">
            <span class="lbl" data-i18n="fLogo"></span>
            <input type="file" id="logoFile" accept="image/png,image/jpeg,image/svg+xml">
            <button type="button" id="logoRemove" class="link" data-i18n="logoRemove"></button>
            <label class="inline"><span data-i18n="fLogoPos"></span>
              <select data-c="logoPosition">
                <option value="left" data-i18n="posLeft"></option>
                <option value="top" data-i18n="posTop"></option>
                <option value="bottom" data-i18n="posBottom"></option>
              </select></label>
            <label class="inline"><span data-i18n="fLogoWidth"></span>
              <input type="number" data-c="logoWidth" min="60" max="300" step="10"> px</label>
          </div>
        </div>

        <h3 data-i18n="secLegal"></h3>
        <p class="note" data-i18n="legalNote"></p>
        <div class="grid">
          <label><span data-i18n="fSeat"></span><input data-c="seat"></label>
          <label><span data-i18n="fCourt"></span><input data-c="court" data-i18n-placeholder="phCourt"></label>
          <label><span data-i18n="fRegister"></span><input data-c="register" placeholder="HRB 12345"></label>
          <label><span data-i18n="fVatId"></span><input data-c="vatId" placeholder="DE123456789"></label>
          <label class="wide"><span data-i18n="fManagers"></span><input data-c="managers"></label>
          <label class="wide"><span data-i18n="fDisclaimer"></span><textarea data-c="disclaimer" rows="2"></textarea></label>
        </div>
      </section>

      <section>
        <h2 data-i18n="secIT"></h2>
        <p class="note" data-i18n="itNote"></p>
        <div class="row">
          <input id="configUrl" type="url" placeholder="https://…/teamsignatur.json">
          <button type="button" id="loadUrl" data-i18n="loadUrl"></button>
        </div>
        <details>
          <summary data-i18n="exportTitle"></summary>
          <p class="note" data-i18n="exportNote"></p>
          <textarea id="exportJson" rows="8" readonly></textarea>
          <p class="note" data-i18n="policyNote"></p>
          <textarea id="policyJson" rows="8" readonly></textarea>
          <p class="note" data-i18n="importNote"></p>
          <textarea id="importJson" rows="4" placeholder='{"company": { … }}'></textarea>
          <button type="button" id="importBtn" data-i18n="importBtn"></button>
        </details>
      </section>
    </form>

    <aside class="preview">
      <h2 data-i18n="secPreview"></h2>
      <iframe id="preview" sandbox="" title="preview"></iframe>
      <label class="check"><input type="checkbox" id="autoApply"> <span data-i18n="autoApply"></span></label>
      <button type="button" id="apply" class="primary" data-i18n="apply"></button>
      <p id="status" class="note"></p>
      <p class="note small" data-i18n="sepNote"></p>
    </aside>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="../lib/render.js"></script>
  <script src="signatur.js"></script>
</body>
</html>
